# HAProxy Ingress with NodePort exposure, for clusters without an L2 or
# cloud load balancer. Exposes HTTP on 30080 and HTTPS on 30443 on each node.

rbac:
  create: false

serviceAccount:
  create: false
  name: "haproxy-ingress"

controller:
  ingressClassResource:
    name: haproxy
  ingressClass: haproxy
  extraArgs:
    tcp-services-configmap: your-namespace/haproxy-tcp-services
  service:
    type: NodePort
    externalTrafficPolicy: Cluster
    httpPorts:
      - port: 80
        targetPort: http
        nodePort: 30080
    httpsPorts:
      - port: 443
        targetPort: https
        nodePort: 30443
