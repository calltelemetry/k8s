# Example values for the Vue Web (SPA) chart.

replicaCount: 1
environment: prod
vue_web:
  image:
    pullPolicy: IfNotPresent
  port: 8080
  LogLevel: "INFO"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  ingressClassName: haproxy
  annotations:
    haproxy.org/cookie-strategy: "insert"
    haproxy.org/cookie-name: "CTSESSIONID"
    # Production-style TLS termination via cert-manager:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # haproxy.org/ssl-redirect: "true"
  hosts:
    - host: app.example.com
      paths: ["/", "/#"]
  tls: []
  # tls:
  #   - secretName: app-example-com-tls
  #     hosts:
  #       - app.example.com

resources: {}
