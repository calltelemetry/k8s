# Example values for the ct-ingress chart, using MetalLB L2 advertisement.
# Addresses below are RFC 5737 documentation addresses — replace with real
# IPs from your own MetalLB pool.
#
# For a cluster without MetalLB (e.g. local OrbStack), use
# examples/ingress-clusterip-example-values.yaml instead.
ingress-controller:
  type: haproxy
  class: haproxy
  selector:
    name: "haproxy-ingress"

### Load Balancer Configuration ###
# Primary API Load Balancer
primary_api:
  createLoadBalancer: true
  advertiseL2MetalLb: true
  metal_ip_address: "192.0.2.10"
  annotations:
    haproxy.org/service: primary-api

# Secondary API Load Balancer
secondary_api:
  createLoadBalancer: true
  advertiseL2MetalLb: true
  metal_ip_address: "192.0.2.11"
  annotations:
    haproxy.org/service: secondary-api

# Admin API Load Balancer - Management API
admin_api:
  createLoadBalancer: true
  advertiseL2MetalLb: true
  metal_ip_address: "192.0.2.12"
  annotations:
    haproxy.org/service: admin-api
### /Load Balancer Configuration ###

# Standard HTTP/HTTPS ports
ports:
  http: 80
  https: 443

# TCP Services Configuration (for non-HTTP protocols)
tcpServices:
  # SFTP service
  "22":
    serviceName: sftp-service
    targetPort: 22
  # Syslog service
  "514":
    serviceName: syslog-service
    targetPort: 514
