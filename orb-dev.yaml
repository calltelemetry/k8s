# Orbstack development environment values for CallTelemetry deployment

# Environment information
env:
  namespace: dev
  environment: dev
  domain: dev.k8s.orb.local

# HAProxy configuration (NodePort — OrbStack has no MetalLB/L2 support)
haproxy:
  values_file: examples/haproxy-nodeport-example-values.yaml

# Ingress configuration (no LoadBalancer IPs advertised)
ingress:
  values_file: examples/ingress-clusterip-example-values.yaml

# API configuration
api:
  values_file: examples/api-example-values.yaml

# Vue Web configuration
vue_web:
  values_file: examples/vue-web-example-values.yaml

# Traceroute configuration
traceroute:
  values_file: examples/traceroute-example-values.yaml
