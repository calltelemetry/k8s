version: 4

limits:
  max_diff_bytes: 1000000
  max_file_diff_chars: 10000
  max_prompt_tokens: 60000
  max_completion_tokens: 8000
  max_cost_usd: 5

coverage_policy:
  quorum: two_thirds
  min_personas: 3
  mandatory_personas: [security]
  provider_diversity_min: 1

personas:
  - id: security
  - id: architecture
  - id: testing
  - id: dependencies
  - id: devops

github_action:
  openrouter:
    data_collection: deny
