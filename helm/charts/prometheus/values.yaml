# Prometheus Helm Chart - Development Defaults

# Override the full name - defaults to "prometheus" for simple service name
fullnameOverride: "prometheus"

image:
  repository: prom/prometheus
  tag: v3.11.0
  pullPolicy: IfNotPresent

# Prometheus configuration
config:
  # Global settings
  scrapeInterval: 15s
  evaluationInterval: 15s
  retention: 15d

# Scrape targets - enabled services will be added to prometheus.yml
# Targets are auto-configured with namespace
scrapeTargets:
  # Self-monitoring
  prometheus:
    enabled: true
    port: 9090

  # OpenTelemetry Collector
  otelCollector:
    enabled: true
    port: 8889

  # NATS (via prometheus-nats-exporter sidecar)
  nats:
    enabled: true
    port: 7777

  # SeaweedFS cluster metrics
  seaweedfs:
    enabled: true
    port: 8333
    metricsPath: /metrics

  # PostgreSQL (via postgres-exporter)
  postgresql:
    enabled: true
    port: 9187

  # Caddy gateway
  caddy:
    enabled: true
    port: 2019

  # JTAPI Sidecar (Spring Boot Actuator)
  jtapiSidecar:
    enabled: true
    port: 8080
    metricsPath: /actuator/prometheus

  # CallTelemetry Elixir API (PromEx on CURRI endpoint)
  calltelemetry:
    enabled: true
    port: 4080
    metricsPath: /metrics

  # Dashboard PromEx endpoint in the production dashboard namespace
  dashboard:
    enabled: false
    service: dashapi-dash-api
    namespace: dashboard
    port: 4021
    metricsPath: /metrics

  # Managed kube-state-metrics endpoint in the observability namespace
  kubeStateMetrics:
    enabled: false
    service: kube-state-metrics
    namespace: observability
    port: 8080

  # Node exporter pods are discovered through Kubernetes API endpoint discovery
  nodeExporter:
    enabled: false
    namespace: observability
    service: node-exporter
    port: 9100

  # Kubelet cAdvisor metrics for container resource alerts
  kubeletCadvisor:
    enabled: false

  # Public dashboard check through blackbox-exporter
  dashboardPublic:
    enabled: false
    service: blackbox-exporter
    namespace: observability
    port: 9115
    target: https://dash.calltelemetry.com/health/ready


# Optional consumer-provided Prometheus scrape jobs. Keep service-specific
# targets and credentials in the consuming deployment repository.
extraScrapeConfigs: []

# Optional consumer-provided Secret mounts and volumes. These are rendered
# verbatim so private integrations can mount credentials without chart-owned
# service-specific configuration.
extraSecretMounts: []
extraSecretVolumes: []

# AlertManager integration
alerting:
  enabled: true
  alertmanagerPort: 9093
  extraRules: []

# Service configuration
service:
  type: ClusterIP
  port: 9090

# Persistent storage
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

# Security context
securityContext:
  fsGroup: 65534

nodeSelector: {}
tolerations: []
affinity: {}
