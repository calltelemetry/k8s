{{/*
Prometheus Configuration ConfigMap
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.config.scrapeInterval }}
      evaluation_interval: {{ .Values.config.evaluationInterval }}

    scrape_configs:
      {{- if .Values.scrapeTargets.otelCollector.enabled }}
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['{{ include "prometheus.target" (list "otel-collector" .Values.scrapeTargets.otelCollector.port (.Values.scrapeTargets.otelCollector.namespace | default .Release.Namespace)) }}']
      {{- end }}

      {{- if .Values.scrapeTargets.prometheus.enabled }}
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:{{ .Values.scrapeTargets.prometheus.port }}']
      {{- end }}

      {{- if .Values.scrapeTargets.nats.enabled }}
      # NATS metrics via prometheus-nats-exporter sidecar
      - job_name: 'nats'
        static_configs:
          - targets: ['{{ include "prometheus.target" (list "nats" .Values.scrapeTargets.nats.port (.Values.scrapeTargets.nats.namespace | default .Release.Namespace)) }}']
      {{- end }}

      {{- if .Values.scrapeTargets.seaweedfs.enabled }}
      # SeaweedFS metrics
      - job_name: 'seaweedfs'
        metrics_path: {{ .Values.scrapeTargets.seaweedfs.metricsPath }}
        scheme: http
        static_configs:
          - targets: ['{{ include "prometheus.target" (list "seaweedfs" .Values.scrapeTargets.seaweedfs.port (.Values.scrapeTargets.seaweedfs.namespace | default .Release.Namespace)) }}']
      {{- end }}

      {{- if .Values.scrapeTargets.postgresql.enabled }}
      # PostgreSQL metrics via CNPG native exporter (port 9187 on pod)
      - job_name: 'postgresql'
        static_configs:
          - targets: ['{{ include "prometheus.target" (list "postgresql-metrics" .Values.scrapeTargets.postgresql.port (.Values.scrapeTargets.postgresql.namespace | default .Release.Namespace)) }}']
      {{- end }}

      {{- if .Values.scrapeTargets.caddy.enabled }}
      # Caddy gateway metrics via admin API
      - job_name: 'caddy'
        static_configs:
          - targets: ['{{ include "prometheus.target" (list "gateway" .Values.scrapeTargets.caddy.port (.Values.scrapeTargets.caddy.namespace | default .Release.Namespace)) }}']
      {{- end }}

      {{- if .Values.scrapeTargets.jtapiSidecar.enabled }}
      # JTAPI Sidecar metrics via Spring Boot Actuator
      - job_name: 'jtapi-sidecar'
        metrics_path: {{ .Values.scrapeTargets.jtapiSidecar.metricsPath }}
        static_configs:
          - targets: ['{{ include "prometheus.target" (list "jtapi-sidecar" .Values.scrapeTargets.jtapiSidecar.port (.Values.scrapeTargets.jtapiSidecar.namespace | default .Release.Namespace)) }}']
      {{- end }}

      {{- if .Values.scrapeTargets.calltelemetry.enabled }}
      # CallTelemetry Elixir API metrics (PromEx SystemHealth plugin)
      - job_name: 'calltelemetry'
        scrape_interval: 30s
        metrics_path: {{ .Values.scrapeTargets.calltelemetry.metricsPath | default "/metrics" }}
        static_configs:
          - targets: ['{{ include "prometheus.target" (list "admin-service" .Values.scrapeTargets.calltelemetry.port (.Values.scrapeTargets.calltelemetry.namespace | default .Release.Namespace)) }}']
      {{- end }}

      {{- if .Values.scrapeTargets.dashboard.enabled }}
      # Dashboard PromEx metrics from the production dashboard namespace
      - job_name: 'dashboard'
        scrape_interval: 30s
        metrics_path: {{ .Values.scrapeTargets.dashboard.metricsPath | default "/metrics" }}
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - {{ .Values.scrapeTargets.dashboard.namespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: {{ .Values.scrapeTargets.dashboard.service }}
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
      {{- end }}

      {{- if .Values.scrapeTargets.kubeStateMetrics.enabled }}
      # Kubernetes object state
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['{{ include "prometheus.target" (list .Values.scrapeTargets.kubeStateMetrics.service .Values.scrapeTargets.kubeStateMetrics.port .Values.scrapeTargets.kubeStateMetrics.namespace) }}']
      {{- end }}

      {{- if .Values.scrapeTargets.nodeExporter.enabled }}
      # Node exporter DaemonSet endpoints discovered through Kubernetes
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - {{ .Values.scrapeTargets.nodeExporter.namespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: {{ .Values.scrapeTargets.nodeExporter.service }}
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
      {{- end }}

      {{- if .Values.scrapeTargets.kubeletCadvisor.enabled }}
      # Kubelet cAdvisor metrics for container memory, CPU, and throttling alerts
      - job_name: 'kubelet-cadvisor'
        scheme: https
        metrics_path: /metrics/cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      {{- end }}

      {{- if .Values.scrapeTargets.dashboardPublic.enabled }}
      # Independent public readiness check through blackbox-exporter
      - job_name: 'dashboard-public'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - {{ .Values.scrapeTargets.dashboardPublic.target | quote }}
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: '{{ include "prometheus.target" (list .Values.scrapeTargets.dashboardPublic.service .Values.scrapeTargets.dashboardPublic.port .Values.scrapeTargets.dashboardPublic.namespace) }}'
      {{- end }}

      {{- if .Values.scrapeTargets.bifrost.enabled }}
      # Bifrost LLM gateway metrics. Authentication is enabled for the
      # gateway, so production overlays must provide a mounted Secret.
      - job_name: 'ct-llm-gateway'
        scrape_interval: {{ .Values.scrapeTargets.bifrost.scrapeInterval | default "15s" }}
        metrics_path: {{ .Values.scrapeTargets.bifrost.metricsPath | default "/metrics" }}
        static_configs:
          - targets: ['{{ include "prometheus.target" (list .Values.scrapeTargets.bifrost.service .Values.scrapeTargets.bifrost.port .Values.scrapeTargets.bifrost.namespace) }}']
        {{- if .Values.scrapeTargets.bifrost.basicAuth.enabled }}
        basic_auth:
          username_file: /etc/prometheus/secrets/bifrost/{{ .Values.scrapeTargets.bifrost.basicAuth.usernameKey }}
          password_file: /etc/prometheus/secrets/bifrost/{{ .Values.scrapeTargets.bifrost.basicAuth.passwordKey }}
        {{- end }}
      {{- end }}

      {{- if .Values.alerting.enabled }}
      - job_name: 'alertmanager'
        static_configs:
          - targets: ['{{ include "prometheus.target" (list "alertmanager" .Values.alerting.alertmanagerPort .Release.Namespace) }}']

    # AlertManager integration
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['{{ include "prometheus.target" (list "alertmanager" .Values.alerting.alertmanagerPort .Release.Namespace) }}']

    rule_files:
      - /etc/prometheus/alert_rules.yml
    {{- end }}

  {{- if .Values.alerting.enabled }}
  alert_rules.yml: |
    groups:
      - name: dashboard_availability
        rules:
          - alert: DashboardPublicProbeFailed
            expr: probe_success{job="dashboard-public"} == 0
            for: 2m
            labels:
              severity: critical
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Public dashboard readiness check failed'
              description: 'dash.calltelemetry.com/health/ready has failed through the independent blackbox probe for two minutes.'

          - alert: DashboardMetricsTargetDown
            expr: up{job="dashboard"} == 0
            for: 2m
            labels:
              severity: critical
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard metrics target is down'
              description: 'Prometheus cannot scrape the dashboard PromEx endpoint for two minutes.'

          - alert: DashboardNoReadyReplicas
            expr: kube_deployment_status_replicas_available{namespace="dashboard", deployment="dashapi-dash-api"} < 1
            for: 1m
            labels:
              severity: critical
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard has no ready replicas'
              description: 'The dashboard Deployment has no available pod serving traffic.'

          - alert: DashboardUnavailableReplicas
            expr: kube_deployment_status_replicas_unavailable{namespace="dashboard", deployment="dashapi-dash-api"} > 0
            for: 5m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard has unavailable replicas'
              description: 'At least one desired dashboard replica has been unavailable for five minutes.'

          - alert: DashboardOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{namespace="dashboard", container="dash-api", reason="OOMKilled"} == 1
              and on(namespace, pod, container) changes(kube_pod_container_status_restarts_total{namespace="dashboard", container="dash-api"}[10m]) > 0
            for: 2m
            labels:
              severity: critical
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard container was OOMKilled'
              description: 'A dashboard container was OOMKilled within the last ten minutes.'

          - alert: DashboardCrashLoopBackOff
            expr: kube_pod_container_status_waiting_reason{namespace="dashboard", container="dash-api", reason="CrashLoopBackOff"} == 1
            for: 2m
            labels:
              severity: critical
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard is in CrashLoopBackOff'
              description: 'A dashboard container has been unable to start for two minutes.'

          - alert: DashboardRestartStorm
            expr: increase(kube_pod_container_status_restarts_total{namespace="dashboard", container="dash-api"}[10m]) > 3
            for: 5m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard restart storm detected'
              description: 'A dashboard container restarted more than three times in ten minutes.'

          - alert: DashboardRolloutStalled
            expr: kube_deployment_status_condition{namespace="dashboard", deployment="dashapi-dash-api", condition="Progressing", status="false", reason="ProgressDeadlineExceeded"} == 1
            for: 5m
            labels:
              severity: critical
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard rollout is stalled'
              description: 'The dashboard Deployment has exceeded its progress deadline.'

          - alert: DashboardMemoryNearLimit
            expr: |
              sum by (pod) (container_memory_working_set_bytes{namespace="dashboard", pod=~"dashapi-dash-api-.*", container="dash-api"})
                /
              sum by (pod) (kube_pod_container_resource_limits{namespace="dashboard", pod=~"dashapi-dash-api-.*", container="dash-api", resource="memory", unit="byte"}) > 0.85
            for: 10m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard memory is near its limit'
              description: 'A dashboard pod has used more than 85% of its memory limit for ten minutes.'

          - alert: DashboardCPUThrottling
            expr: |
              sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="dashboard", pod=~"dashapi-dash-api-.*", container="dash-api"}[5m]))
                /
              sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="dashboard", pod=~"dashapi-dash-api-.*", container="dash-api"}[5m])) > 0.25
            for: 10m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard CPU is being throttled'
              description: 'A dashboard pod has had more than 25% of CPU periods throttled for ten minutes.'

          - alert: DashboardCPUHigh
            expr: |
              sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="dashboard", pod=~"dashapi-dash-api-.*", container="dash-api"}[5m]))
                /
              sum by (pod) (kube_pod_container_resource_limits{namespace="dashboard", pod=~"dashapi-dash-api-.*", container="dash-api", resource="cpu", unit="core"}) > 0.8
            for: 10m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard CPU usage is high'
              description: 'A dashboard pod has used more than 80% of its CPU limit for ten minutes.'

          - alert: DashboardHTTP5xx
            expr: sum(rate(dash_api_prom_ex_phoenix_http_requests_total{job="dashboard", status=~"5.."}[5m])) > 0
            for: 5m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard is returning HTTP 5xx responses'
              description: 'The dashboard has returned server errors continuously for five minutes.'

          - alert: DashboardHTTPHighLatency
            expr: histogram_quantile(0.95, sum by (le) (rate(dash_api_prom_ex_phoenix_http_request_duration_milliseconds_bucket{job="dashboard"}[5m]))) > 1000
            for: 10m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard p95 latency is above one second'
              description: 'The dashboard HTTP request p95 has exceeded one second for ten minutes.'

          - alert: DashboardObanRetryableJobs
            expr: max by (queue) (dash_api_prom_ex_oban_queue_length_count{job="dashboard", state="retryable"}) > 5
            for: 5m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard Oban queue has retryable jobs'
              description: 'A dashboard background queue has more than five retryable jobs.'

          - alert: DashboardObanAvailableBacklog
            expr: max by (queue) (dash_api_prom_ex_oban_queue_length_count{job="dashboard", state="available"}) > 100
            for: 10m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard Oban queue backlog is growing'
              description: 'A dashboard background queue has more than 100 available jobs for ten minutes.'

          - alert: DashboardObanDiscardedJobs
            expr: max by (queue) (dash_api_oban_discarded_jobs_last_24h{job="dashboard"}) > 0
            for: 5m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard Oban has discarded jobs'
              description: 'A dashboard background queue has discarded jobs from the last 24 hours for five minutes.'

          - alert: DashboardObanDiscardedQueue
            expr: max by (queue) (dash_api_prom_ex_oban_queue_length_count{job="dashboard", state="discarded"}) > 0
            for: 5m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Dashboard Oban has persisted discarded jobs'
              description: 'Dashboard Oban has discarded jobs remaining in the database for the {{`{{ $labels.queue }}`}} queue; investigate before replaying them.'

          - alert: DashboardProductlaneRateLimited
            expr: sum by (operation) (increase(dash_api_productlane_rate_limited_total{job="dashboard"}[10m])) > 0
            for: 5m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Productlane writes are rate limited'
              description: 'Productlane returned a rate-limit response for the {{`{{ $labels.operation }}`}} operation in the last ten minutes.'

          - alert: DashboardProductlaneWriteSnoozed
            expr: sum by (operation) (increase(dash_api_productlane_write_total{job="dashboard", outcome="snoozed"}[10m])) > 5
            for: 5m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Productlane writes are being snoozed'
              description: 'More than five Productlane writes were snoozed for the {{`{{ $labels.operation }}`}} operation in ten minutes.'

          - alert: DashboardProductlaneWriteFailed
            expr: sum by (operation) (increase(dash_api_productlane_write_total{job="dashboard", outcome="failed"}[10m])) > 0
            for: 5m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Productlane writes are failing'
              description: 'A Productlane write failed for the {{`{{ $labels.operation }}`}} operation in the last ten minutes.'

          - alert: DashboardProductlaneDeduplicatedWrites
            expr: sum by (operation) (increase(dash_api_productlane_write_total{job="dashboard", outcome="deduplicated"}[1h])) > 10
            for: 10m
            labels:
              severity: warning
              namespace: dashboard
              workload: dashapi-dash-api
            annotations:
              summary: 'Productlane deduplication volume is elevated'
              description: 'More than ten Productlane writes were deduplicated for the {{`{{ $labels.operation }}`}} operation in the last hour.'

      - name: observability_health
        rules:
          - alert: PrometheusTargetDown
            expr: up{job="prometheus"} == 0
            for: 2m
            labels:
              severity: critical
              namespace: observability
              workload: prometheus
            annotations:
              summary: 'Prometheus self-monitoring target is down'
              description: 'Prometheus cannot scrape its own health endpoint.'

          - alert: AlertmanagerTargetDown
            expr: up{job="alertmanager"} == 0
            for: 2m
            labels:
              severity: critical
              namespace: observability
              workload: alertmanager
            annotations:
              summary: 'Alertmanager target is down'
              description: 'Prometheus cannot reach Alertmanager for two minutes.'

          - alert: KubernetesNodeNotReady
            expr: kube_node_status_condition{condition="Ready", status="true"} == 0
            for: 5m
            labels:
              severity: critical
              namespace: observability
              workload: kubernetes-node
            annotations:
              summary: 'Kubernetes node is not Ready'
              description: 'A DOKS worker node has been NotReady for five minutes.'

          - alert: KubernetesNodeMemoryPressure
            expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
            for: 5m
            labels:
              severity: warning
              namespace: observability
              workload: kubernetes-node
            annotations:
              summary: 'Kubernetes node has memory pressure'
              description: 'A DOKS worker node has reported memory pressure for five minutes.'

          - alert: NodeFilesystemSpaceLow
            expr: (node_filesystem_avail_bytes{mountpoint="/", fstype!=""} / node_filesystem_size_bytes{mountpoint="/", fstype!=""}) < 0.15
            for: 10m
            labels:
              severity: warning
              namespace: observability
              workload: kubernetes-node
            annotations:
              summary: 'Node root filesystem space is low'
              description: 'A DOKS worker node has less than 15% free root filesystem space.'

          - alert: KubernetesNodeDiskPressure
            expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
            for: 5m
            labels:
              severity: warning
              namespace: observability
              workload: kubernetes-node
            annotations:
              summary: 'Kubernetes node has disk pressure'
              description: 'A DOKS worker node has reported disk pressure for five minutes.'

          - alert: KubernetesNodeMemoryLow
            expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.15
            for: 10m
            labels:
              severity: warning
              namespace: observability
              workload: kubernetes-node
            annotations:
              summary: 'Node available memory is low'
              description: 'A DOKS worker node has less than 15% available memory for ten minutes.'

          - alert: KubernetesNodeCPUHigh
            expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 85
            for: 10m
            labels:
              severity: warning
              namespace: observability
              workload: kubernetes-node
            annotations:
              summary: 'Node CPU usage is high'
              description: 'A DOKS worker node has used more than 85% CPU for ten minutes.'

      - name: system_health
        rules:
          - alert: HighDiskUsage
            expr: ct_disk_usage_percent{mount="/"} > 90
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Disk usage {{`{{ $value }}`}}% exceeds 90% on mount {{`{{ $labels.mount }}`}}'
              description: 'Root partition disk usage has been above 90% for 5 minutes.'
              generator_url: '/grafana/d/ct-system-health/system-health?viewPanel=3&from=now-1h&to=now'

          - alert: HighCPUUsage
            expr: ct_cpu_usage_percent > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'CPU usage {{`{{ $value }}`}}% exceeds 80%'
              description: 'CPU utilization has been above 80% for 5 minutes.'
              generator_url: '/grafana/d/ct-system-health/system-health?viewPanel=9&from=now-1h&to=now'

          - alert: HighMemoryUsage
            expr: ct_memory_usage_percent > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Memory usage {{`{{ $value }}`}}% exceeds 85%'
              description: 'System memory usage has been above 85% for 5 minutes.'
              generator_url: '/grafana/d/ct-system-health/system-health?viewPanel=10&from=now-1h&to=now'

      - name: application_health
        rules:
          {{- if .Values.scrapeTargets.calltelemetry.enabled }}
          - alert: AppDown
            expr: up{job="calltelemetry"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: 'Call Telemetry API is DOWN'
              description: 'The Call Telemetry API has been unreachable for 30 seconds.'
              generator_url: '/grafana/d/ct-system-resources/system-resources?viewPanel=5&from=now-1h&to=now'
          {{- end }}

          {{- if .Values.scrapeTargets.nats.enabled }}
          - alert: NATSDisconnected
            expr: ct_nats_connection_status == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: 'NATS connection lost'
              description: 'The NATS message broker connection has been down for 30 seconds.'
              generator_url: '/grafana/d/ct-system-health/system-health?viewPanel=4&from=now-30m&to=now'
          {{- end }}

          - alert: HighProcessCount
            expr: ct_beam_process_count > 50000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Active task count {{`{{ $value }}`}} exceeds 50000'
              description: 'High active task count may indicate a resource leak in the Call Telemetry service.'
              generator_url: '/grafana/d/ct-system-resources/system-resources?viewPanel=6&from=now-1h&to=now'

      - name: oban_health
        rules:
          - alert: ObanRetryableJobs
            expr: ct_oban_queue_depth{state="retryable"} > 50
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Background processing queue {{`{{ $labels.queue }}`}} has {{`{{ $value }}`}} retryable jobs'
              description: 'High retryable job count in the {{`{{ $labels.queue }}`}} queue may indicate persistent failures.'
              generator_url: '/grafana/d/ct-oban-job-health/oban-job-health?viewPanel=4&from=now-1h&to=now'

          - alert: ObanAvailableBacklog
            expr: ct_oban_queue_depth{state="available"} > 100
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 'Background job backlog: {{`{{ $value | printf "%.0f" }}`}} pending jobs in {{`{{ $labels.queue }}`}} queue'
              description: 'A background processing queue has accumulated pending jobs for over 10 minutes. This may indicate a stalled or failing subsystem.'
              generator_url: '/grafana/d/ct-oban-job-health/oban-job-health?viewPanel=5&from=now-1h&to=now'

          - alert: PurgeHealthQueueRetryable
            expr: ct_oban_queue_depth{queue="db_purge_health", state="retryable"} > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Data retention health queue has {{`{{ $value }}`}} retryable jobs'
              description: 'The data retention health queue has failing jobs. Purge health audits may not be running.'

          - alert: PurgeDispatchQueueRetryable
            expr: ct_oban_queue_depth{queue="db_purge_dispatch", state="retryable"} > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Data retention dispatch queue has {{`{{ $value }}`}} retryable jobs'
              description: 'The data retention dispatch queue has failing jobs. Scheduled purges may not be running.'

      - name: call_health
        rules:
          - alert: PhoneRegistrationDrop
            expr: ct_phones_registration_percent < 95
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'Phone registration dropped to {{`{{ $value }}`}}% on cluster {{`{{ $labels.callmanager_id }}`}}'
              description: 'Less than 95% of phones are registered. Possible CUCM or network issue.'
              generator_url: '/grafana/d/ct-phone-registration/phone-registration?viewPanel=5&from=now-1h&to=now'

          - alert: PhoneRegistrationCritical
            expr: ct_phones_registration_percent < 80
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'CRITICAL: Only {{`{{ $value }}`}}% phones registered on cluster {{`{{ $labels.callmanager_id }}`}}'
              description: 'Major registration loss. Users are likely unable to make calls.'
              generator_url: '/grafana/d/ct-phone-registration/phone-registration?viewPanel=5&from=now-30m&to=now'

          - alert: CDRIngestionStopped
            expr: ct_cdr_ingestion_lag_seconds > 300
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'No CDR records received for org {{`{{ $labels.org_id }}`}} in {{`{{ $value }}`}}s'
              description: 'CDR ingestion has stopped. Call records are not being captured. Audit trail at risk.'
              generator_url: '/grafana/d/ct-cdr-ingestion/cdr-ingestion?viewPanel=4&from=now-1h&to=now'

          - alert: CDRIngestionCritical
            expr: ct_cdr_ingestion_lag_seconds > 900
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'CDR ingestion down for 15+ minutes (org {{`{{ $labels.org_id }}`}})'
              description: 'No call records for over 15 minutes. SFTP may be broken or CUCM stopped sending CDRs.'
              generator_url: '/grafana/d/ct-cdr-ingestion/cdr-ingestion?viewPanel=4&from=now-1h&to=now'

      - name: license_health
        rules:
          - alert: LicenseExpiringSoon
            expr: ct_license_days_until_expiry < 30
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: 'License for org {{`{{ $labels.org_id }}`}} expires in {{`{{ $value }}`}} days'
              description: 'License expiration is approaching. Renew before it expires to avoid downgrade to Community Edition.'
              generator_url: '/grafana/d/ct-system-health/system-health?viewPanel=15&from=now-7d&to=now'

          - alert: LicenseExpiryCritical
            expr: ct_license_days_until_expiry < 7
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: 'CRITICAL: License for org {{`{{ $labels.org_id }}`}} expires in {{`{{ $value }}`}} days'
              description: 'License is about to expire. Immediate renewal required to prevent service downgrade.'
              generator_url: '/grafana/d/ct-system-health/system-health?viewPanel=15&from=now-7d&to=now'

      - name: certificate_health
        rules:
          - alert: CertificateExpiringSoon
            expr: ct_cert_days_until_expiry < 30
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: 'Certificate {{`{{ $labels.cert_name }}`}} expires in {{`{{ $value }}`}} days'
              description: 'TLS certificate expiration is approaching. Renew to avoid service disruption.'
              generator_url: '/grafana/d/ct-system-health/system-health?viewPanel=15&from=now-7d&to=now'

          - alert: CertificateExpiryCritical
            expr: ct_cert_days_until_expiry < 7
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: 'CRITICAL: Certificate {{`{{ $labels.cert_name }}`}} expires in {{`{{ $value }}`}} days'
              description: 'TLS certificate is about to expire. Immediate renewal required.'
              generator_url: '/grafana/d/ct-system-health/system-health?viewPanel=15&from=now-7d&to=now'

      - name: purge_health
        rules:
          - alert: PurgeDispatcherStale
            expr: ct_purge_last_dispatch_seconds_ago > 7200
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Purge dispatcher has not run in over 2 hours'
              description: 'The hourly purge dispatcher has not completed successfully. Tables may grow unchecked.'
              generator_url: '/grafana/d/ct-oban-job-health/oban-job-health?from=now-6h&to=now'

          - alert: PurgeJobFailures
            expr: ct_purge_failed_jobs_count > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Failed purge jobs detected in last 24h'
              description: 'Database purge jobs are failing. Data retention policies may not be enforced.'

          - alert: PurgeTablesAboveMax
            expr: ct_purge_tables_above_max > 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: 'Tables above max size threshold'
              description: 'Tables have exceeded their maximum size. Emergency purging may be needed.'

          - alert: PurgeTablesStale
            expr: ct_purge_tables_stale > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: '{{`{{ $value }}`}} table(s) not purged in 48h for org {{`{{ $labels.org_id }}`}}'
              description: 'Tables have not been purged in over 48 hours. Data retention policies are not being enforced. Check purge dispatcher and background processing queue health.'

          - alert: PurgeAuditCriticalIssues
            expr: ct_purge_audit_critical_issues > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: '{{`{{ $value }}`}} critical issue(s) found in purge audit'
              description: 'The most recent purge audit found critical issues that need attention. Check the purge configuration and audit logs.'

          - alert: PurgeTablesStaleHalf
            expr: ct_purge_tables_stale > (ct_purge_tables_monitored / 2)
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: 'Over half of monitored tables are stale ({{`{{ $value }}`}}) for org {{`{{ $labels.org_id }}`}}'
              description: 'More than 50% of tables have not been purged in 48 hours. Purge system may be completely broken.'
{{- with .Values.alerting.extraRules }}
{{ toYaml . | nindent 6 }}
{{- end }}
  {{- end }}
