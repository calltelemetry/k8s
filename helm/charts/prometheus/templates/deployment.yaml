{{/*
Prometheus Deployment
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Prometheus uses a single RWO PVC. Recreate prevents two pods from
  # opening the same TSDB during a config rollout and failing on the lock.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "prometheus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prometheus.selectorLabels" . | nindent 8 }}
      annotations:
        # Force pod restart when config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "prometheus.fullname" . }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prometheus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time={{ .Values.config.retention }}'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
            {{- if and .Values.scrapeTargets.bifrost.enabled .Values.scrapeTargets.bifrost.basicAuth.enabled }}
            - name: bifrost-metrics-auth
              mountPath: /etc/prometheus/secrets/bifrost
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "prometheus.fullname" . }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "prometheus.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if and .Values.scrapeTargets.bifrost.enabled .Values.scrapeTargets.bifrost.basicAuth.enabled }}
        - name: bifrost-metrics-auth
          secret:
            secretName: {{ .Values.scrapeTargets.bifrost.basicAuth.secretName }}
            items:
              - key: {{ .Values.scrapeTargets.bifrost.basicAuth.usernameKey }}
                path: {{ .Values.scrapeTargets.bifrost.basicAuth.usernameKey }}
              - key: {{ .Values.scrapeTargets.bifrost.basicAuth.passwordKey }}
                path: {{ .Values.scrapeTargets.bifrost.basicAuth.passwordKey }}
        {{- end }}
