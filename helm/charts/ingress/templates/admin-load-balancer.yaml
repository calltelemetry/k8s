{{- if .Values.admin_api.createLoadBalancer }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-admin-lb
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-admin
  annotations:
    {{- if .Values.admin_api.advertiseL2MetalLb }}
    metallb.universe.tf/address-pool: admin-ip-{{ .Release.Namespace }}
    {{- end }}
    {{- with .Values.loadBalancer.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.admin_api.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: LoadBalancer
  # ct-meta ADR 0613 (REL-948): Cluster is the historical default and stays the
  # default here so every existing release is a byte-identical no-op.
  # Local is required (alongside a REGIONAL_NETWORK LB) to preserve real
  # client source IPs without PROXY protocol; set
  # admin_api.externalTrafficPolicy: Local only after confirming a
  # controller pod runs on every node the DO Network LB health-checks.
  externalTrafficPolicy: {{ .Values.admin_api.externalTrafficPolicy | default "Cluster" }}
  selector:
    {{- include "ingress.controllerSelector" . | nindent 4 }}
  ports:
    # Standard HTTP/HTTPS ports
    - port: {{ .Values.ports.http }}
      targetPort: 80
      protocol: TCP
      name: http
    - port: {{ .Values.ports.https }}
      targetPort: 443
      protocol: TCP
      name: https
    # TCP services (SFTP, Syslog, etc.)
    {{- range $port, $service := .Values.tcpServices }}
    - port: {{ $port | int }}
      targetPort: {{ $service.targetPort }}
      protocol: TCP
      name: {{ $service.serviceName | replace "-service" "" }}
    {{- end }}
{{- end }}
