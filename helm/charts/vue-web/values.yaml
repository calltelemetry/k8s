# vue-web Helm Chart - CallTelemetry Defaults
# Vue 3/Quasar SPA served by Caddy

# Override the full name - "ct-vue" is the canonical service name
fullnameOverride: "ct-vue"

replicaCount: 1

image:
  repository: calltelemetry/vue
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Caddy log level
logLevel: "INFO"

# API backend URL (used for runtime config injection)
api:
  # Service name of the backend API
  service: "admin-service"
  port: 4000

# Ingress configuration (disabled for dev, enabled for production)
ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts:
    - host: app.calltelemetry.com
      paths: ["/"]
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Health check configuration
healthCheck:
  liveness:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5

# HMR / live recompiling mode (design §14). When enabled, the deployment runs a
# `quasar dev` Vite dev server fed by an in-place git fetch+reset loop instead of
# the static Caddy image. Set by ct-preview from a plan's `hmr: { branch }` form.
hmr:
  enabled: false
  repo: "https://github.com/calltelemetry/ct-quasar"
  branch: ""
  port: 9200
  devImage: "node:24"
  gitImage: "alpine/git:latest"
  # Secret (key: token) holding a GitHub token for cloning the private repo.
  # optional: a public repo needs none. ct-preview creates it from the runner token.
  gitSecret: "ct-quasar-hmr-git"
  pullPeriodSeconds: 15
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "3Gi"
