apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vue-web.fullname" . }}
  labels:
    {{- include "vue-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vue-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vue-web.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.hmr.enabled }}
      # ---------------------------------------------------------------------
      # HMR / live recompiling mode (design §14).
      # An in-place `git fetch + reset --hard` loop (NOT git-sync's rotating
      # worktree, which swaps the inode Vite watches and breaks HMR) keeps the
      # branch checkout current; `quasar dev` serves Vite HMR off it. node_modules
      # is gitignored so `reset --hard` never touches it.
      # ---------------------------------------------------------------------
      volumes:
        - name: repo
          emptyDir: {}
        - name: yarn-cache
          emptyDir: {}
      initContainers:
        - name: git-clone
          image: {{ .Values.hmr.gitImage | quote }}
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hmr.gitSecret | quote }}
                  key: token
                  optional: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              auth=""
              [ -n "${GIT_TOKEN:-}" ] && auth="x-access-token:${GIT_TOKEN}@"
              url="$(printf '%s' '{{ .Values.hmr.repo }}' | sed -E "s#^https://#https://${auth}#")"
              git clone --branch '{{ .Values.hmr.branch }}' --depth 1 "$url" /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
        - name: yarn-install
          image: {{ .Values.hmr.devImage | quote }}
          workingDir: /repo
          env:
            - name: YARN_CACHE_FOLDER
              value: /yarn-cache
            - name: COREPACK_HOME
              value: /opt/corepack
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              corepack enable
              yarn install
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: yarn-cache
              mountPath: /yarn-cache
          {{- with .Values.hmr.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: git-pull
          image: {{ .Values.hmr.gitImage | quote }}
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hmr.gitSecret | quote }}
                  key: token
                  optional: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                git -C /repo fetch origin '{{ .Values.hmr.branch }}' --quiet 2>/dev/null || true
                git -C /repo reset --hard 'origin/{{ .Values.hmr.branch }}' --quiet 2>/dev/null || true
                sleep {{ .Values.hmr.pullPeriodSeconds }}
              done
          volumeMounts:
            - name: repo
              mountPath: /repo
        - name: {{ .Chart.Name }}
          image: {{ .Values.hmr.devImage | quote }}
          workingDir: /repo
          env:
            - name: NODE_ENV
              value: development
            - name: API_URL
              value: "http://{{ .Values.api.service }}:{{ .Values.api.port }}"
            - name: YARN_CACHE_FOLDER
              value: /yarn-cache
            # PROVEN-ESSENTIAL (design 2026-06-01): k8s overlayfs + git writes do
            # not fire inotify, so Vite's watcher must poll — without this, content
            # only updates on manual refresh (no live HMR swap). With it,
            # zero-refresh HMR was confirmed end-to-end via Playwright.
            - name: CHOKIDAR_USEPOLLING
              value: "true"
            # COREPACK_HOME must live OUTSIDE the type:module project tree, or yarn
            # loads as ESM and `require` breaks.
            - name: COREPACK_HOME
              value: /opt/corepack
          command: ["/bin/bash", "-c"]
          args:
            - |
              corepack enable
              exec npx quasar dev --hostname 0.0.0.0 --port {{ .Values.hmr.port }}
          ports:
            - name: http
              containerPort: {{ .Values.hmr.port }}
              protocol: TCP
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: yarn-cache
              mountPath: /yarn-cache
          {{- with .Values.hmr.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- else }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default .Values.service.port }}
              protocol: TCP
          env:
            - name: CADDY_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: API_URL
              value: "http://{{ .Values.api.service }}:{{ .Values.api.port }}"
          {{- if .Values.healthCheck }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readiness.periodSeconds }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
