# AlertManager Helm Chart - CallTelemetry

fullnameOverride: "alertmanager"

image:
  repository: prom/alertmanager
  tag: v0.32.1
  pullPolicy: IfNotPresent

# AlertManager routing and receiver configuration
config:
  resolveTimeout: 5m
  emailTo: ""

  route:
    receiver: calltelemetry-webhook
    groupBy: ['alertname', 'namespace', 'workload']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      # Dashboard availability and application alerts go directly to email.
      - match:
          namespace: dashboard
          severity: warning
        receiver: dashboard-email
        continue: true
      - match:
          namespace: observability
          severity: warning
        receiver: dashboard-email
        continue: true
      # Critical: one email plus the preserved webhook.
      - match:
          severity: critical
        receiver: critical-direct
      # All: webhook to API
      - receiver: calltelemetry-webhook

  receivers:
    - name: dashboard-email
      emailConfigs:
        - to: ""
          sendResolved: true

    - name: calltelemetry-webhook
      webhookConfigs:
        - url: 'http://admin-service:4000/api/internal/alertmanager-webhook'
          sendResolved: true

    - name: critical-direct
      webhookConfigs:
        - url: 'http://admin-service:4000/api/internal/alertmanager-webhook'
          sendResolved: true

  smtp:
    enabled: false
    smarthost: smtp.mailgun.org:587
    from: alerts@calltelemetry.com
    authUsername: postmaster@calltelemetry.com
    existingSecret: alertmanager-mailgun
    passwordKey: smtp_password

# Alert rules (mounted into Prometheus, not AlertManager)
alertRules:
  enabled: true

# Service
service:
  type: ClusterIP
  port: 9093

# Persistent storage for silences and notification state
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

# Resources
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Alertmanager runs as nobody and needs group write access to its persistent
# notification log and silence database.
securityContext:
  fsGroup: 65534
  fsGroupChangePolicy: OnRootMismatch

nodeSelector: {}
tolerations: []
affinity: {}
