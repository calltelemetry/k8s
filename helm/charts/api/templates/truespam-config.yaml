{{- if .Values.truespam.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default (printf "%s-truespam-config" .Release.Name) .Values.truespam.configMapName | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/component: truespam
data:
  TRUESPAM_CREDENTIAL_ENCRYPTION_KEY_VERSION: {{ .Values.truespam.keyVersion | quote }}
  TRUESPAM_DEMO_LIMITS_LEGAL_CONFIRMED: {{ .Values.truespam.demoLimitsLegalConfirmed | quote }}
{{- end }}
