# CallTelemetry Helmfile Deployment
# This helmfile deploys the entire CallTelemetry environment based on the namespace value
# Usage: helmfile --environment ct-dev sync

repositories:
  - name: haproxy-ingress
    url: https://haproxy-ingress.github.io/charts
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: nats
    url: https://nats-io.github.io/k8s/helm/charts
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - name: calltelemetry
    url: https://calltelemetry.github.io/k8s/helm/charts
  - name: jetstack
    url: https://charts.jetstack.io

# Global values that can be referenced in releases
helmDefaults:
  wait: false
  timeout: 600
  atomic: false

# Environment values
environments:
  default:
    values:
      - env-common.yaml
      - env-dev.yaml
  ct-dev:
    values:
      - env-common.yaml
      - env-dev.yaml
  ct-prod:
    values:
      - env-common.yaml
      - env-prod.yaml
  ct-test:
    values:
      - env-common.yaml
      - env-dev.yaml
  orb-dev:
    values:
      - env-common.yaml
      - orb-dev.yaml
  ct-appliance:
    values:
      - env-common.yaml
      - env-appliance.yaml

---
# Global hooks
---
# Releases to be deployed
releases:
  # MetalLB
  - name: metallb
    namespace: metallb-system
    chart: metallb/metallb
    createNamespace: true
    version: 0.14.9

  # CloudNativePG Operator (cluster-wide, manages PostgreSQL clusters)
  - name: cnpg
    namespace: cnpg-system
    chart: cnpg/cloudnative-pg
    createNamespace: true
    version: 0.23.0

  # PostgreSQL Database (using CloudNativePG operator)
  - name: postgresql
    namespace: "{{ .Environment.Values.env.namespace }}"
    chart: ./helm/charts/postgresql
    values:
      - '{{ .Environment.Values.postgresql.values_file | default "examples/postgresql-dev-values.yaml" }}'
    needs:
      - cnpg-system/cnpg

  # cert-manager (TLS certificate automation via Let's Encrypt)
  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    createNamespace: true
    version: 1.17.1
    values:
      - crds:
          enabled: true

  # Production-only observability platform. This is intentionally separate
  # from the ci-analytics monitoring installation and from product releases.
  - name: prometheus
    namespace: "{{ .Environment.Values.observability.namespace }}"
    createNamespace: true
    condition: observability.enabled
    chart: ./helm/charts/prometheus
    values:
      - examples/prometheus-observability-prod-values.yaml

  - name: alertmanager
    namespace: "{{ .Environment.Values.observability.namespace }}"
    createNamespace: true
    condition: observability.enabled
    chart: ./helm/charts/alertmanager
    values:
      - examples/alertmanager-observability-prod-values.yaml

  - name: kube-state-metrics
    namespace: "{{ .Environment.Values.observability.namespace }}"
    createNamespace: true
    condition: observability.enabled
    chart: ./helm/charts/kube-state-metrics

  - name: node-exporter
    namespace: "{{ .Environment.Values.observability.namespace }}"
    createNamespace: true
    condition: observability.enabled
    chart: ./helm/charts/node-exporter

  - name: blackbox-exporter
    namespace: "{{ .Environment.Values.observability.namespace }}"
    createNamespace: true
    condition: observability.enabled
    chart: ./helm/charts/blackbox-exporter

  - name: grafana
    namespace: "{{ .Environment.Values.observability.namespace }}"
    createNamespace: true
    condition: observability.enabled
    chart: ./helm/charts/grafana
    values:
      - examples/grafana-observability-prod-values.yaml
    needs:
      - "{{ .Environment.Values.observability.namespace }}/prometheus"
      - "{{ .Environment.Values.observability.namespace }}/alertmanager"

  # HAProxy Ingress Controller
  - name: haproxy-ingress
    namespace: "{{ .Environment.Values.env.namespace }}"
    createNamespace: true
    chart: haproxy-ingress/haproxy-ingress
    version: 0.14.7
    values:
      - "{{ .Environment.Values.haproxy.values_file }}"
    hooks:
      # Apply the ClusterRole first
      - events: ["presync"]
        showlogs: true
        command: "kubectl"
        args: ["apply", "-f", "examples/haproxy-cluster-role.yaml"]

      # Create namespace and apply namespace-specific RBAC based on environment
      - events: ["presync"]
        showlogs: true
        command: "bash"
        args:
          [
            "-c",
            'NAMESPACE={{ .Environment.Values.env.namespace }} && ../scripts/ct-k8s-namespace-ttl.sh apply "$NAMESPACE" && cat examples/haproxy-namespace-template.yaml | sed "s/NAMESPACE_PLACEHOLDER/$NAMESPACE/g" | kubectl apply -f -',
          ]

  # CT Ingress Configs
  - name: ingress-haproxy
    namespace: "{{ .Environment.Values.env.namespace }}"
    createNamespace: true
    version: 0.14.1
    chart: calltelemetry/ct-ingress
    values:
      - "{{ .Environment.Values.ingress.values_file }}"
    needs:
      - "{{ .Environment.Values.env.namespace }}/haproxy-ingress"

  # NATS Server (using local chart)
  - name: nats
    namespace: "{{ .Environment.Values.env.namespace }}"
    chart: ./helm/charts/nats
    values:
      - '{{ .Environment.Values.nats.values_file | default "examples/nats-dev-values.yaml" }}'

  # Call Telemetry API
  - name: api
    namespace: "{{ .Environment.Values.env.namespace }}"
    version: 0.11.13
    chart: calltelemetry/api
    values:
      - "{{ .Environment.Values.api.values_file }}"
    needs:
      - "{{ .Environment.Values.env.namespace }}/ingress-haproxy"
      - "{{ .Environment.Values.env.namespace }}/nats"
      - "{{ .Environment.Values.env.namespace }}/haproxy-ingress"
      - "{{ .Environment.Values.env.namespace }}/postgresql"

  # CT Web Frontend
  - name: ct-web
    namespace: "{{ .Environment.Values.env.namespace }}"
    version: 0.1.6
    chart: calltelemetry/ct-web
    values:
      - "{{ .Environment.Values.vue_web.values_file }}"
    needs:
      - "{{ .Environment.Values.env.namespace }}/api"
      - "{{ .Environment.Values.env.namespace }}/haproxy-ingress"

  # # Microsoft Teams Authentication Service
  # - name: teams-auth
  #   namespace: "{{ .Environment.Values.env.namespace }}"
  #   chart: calltelemetry/teams-auth
  #   version: 1.0.0 # Pinned version for stability
  #   values:
  #     - "{{ .Environment.Values.teams_auth.values_file }}"
  #   needs:
  #     - "{{ .Environment.Values.env.namespace }}/api"

  # Traceroute Service
  - name: traceroute
    namespace: "{{ .Environment.Values.env.namespace }}"
    chart: calltelemetry/traceroute
    values:
      - "{{ .Environment.Values.traceroute.values_file }}"
    needs:
      - "{{ .Environment.Values.env.namespace }}/nats"
      - "{{ .Environment.Values.env.namespace }}/haproxy-ingress"

  # Echo Service
