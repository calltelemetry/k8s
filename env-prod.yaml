# Production environment values for CallTelemetry deployment

# Environment information
env:
  namespace: prod
  environment: prod
  domain: prod.example.com

# HAProxy configuration
haproxy:
  values_file: examples/haproxy-example-values.yaml

# Ingress configuration
ingress:
  values_file: examples/ingress-example-values.yaml

# API configuration
api:
  values_file: examples/api-example-values.yaml

# Vue Web configuration
vue_web:
  values_file: examples/vue-web-example-values.yaml

# Traceroute configuration
traceroute:
  values_file: examples/traceroute-example-values.yaml

# PostgreSQL configuration (CloudNativePG)
postgresql:
  values_file: examples/postgresql-prod-values.yaml

# NATS configuration
nats:
  values_file: examples/nats-prod-values.yaml

# MetalLB IP addresses — documentation-only placeholders (RFC 5737);
# replace with real addresses from your own MetalLB pool.
metallb:
  primary_ip: "192.0.2.20"
  secondary_ip: "192.0.2.21"
  admin_ip: "192.0.2.22"

observability:
  enabled: true
  namespace: observability
