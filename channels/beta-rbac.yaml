apiVersion: v1
kind: ServiceAccount
metadata:
  name: ct-beta-deployer
  namespace: ct-beta
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ct-beta-deployer
  namespace: ct-beta
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - events
      - pods
      - persistentvolumeclaims
      - secrets
      - services
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ct-beta-deployer
  namespace: ct-beta
subjects:
  - kind: ServiceAccount
    name: ct-beta-deployer
    namespace: ct-beta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ct-beta-deployer
